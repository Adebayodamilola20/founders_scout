
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bricolage+Grotesque:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f7;font-family:'Inter',sans-serif;padding:32px 24px 60px}
.page-header{margin-bottom:28px}
.page-header h1{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;color:#1a1a1a;margin-bottom:4px}
.page-header p{font-size:13px;color:#888;font-weight:400}
.tabs{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid #e0e0e0;color:#666;background:#fff;transition:all .15s}
.tab.on{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px}
.screen-wrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.phone-frame{width:200px;height:432px;background:#1a1a1a;border-radius:38px;padding:3px;box-shadow:0 20px 60px rgba(0,0,0,0.18),0 0 0 1px rgba(0,0,0,0.08)}
.phone-inner{width:100%;height:100%;border-radius:36px;overflow:hidden;position:relative;background:#fff}
.screen-label{font-size:11px;font-weight:600;color:#1a1a1a;text-align:center}
.screen-sub{font-size:10px;color:#999;text-align:center}
</style>

<div class="page-header">
  <h1>Founders Scout</h1>
  <p>25 screens · App Store ready · Human UI</p>
</div>

<div class="tabs">
  <div class="tab on" onclick="show('all',this)">All 25</div>
  <div class="tab" onclick="show('onboard',this)">Onboarding</div>
  <div class="tab" onclick="show('radar',this)">Radar</div>
  <div class="tab" onclick="show('leads',this)">Leads</div>
  <div class="tab" onclick="show('pitch',this)">Pitch AI</div>
  <div class="tab" onclick="show('profile',this)">Profile</div>
</div>

<div class="grid" id="grid"></div>

<script>
const screens=[
  {cat:'onboard',num:'01',name:'Welcome',sub:'Splash & entry',html:splash},
  {cat:'onboard',num:'02',name:'Onboard 1',sub:'Find gaps',html:ob1},
  {cat:'onboard',num:'03',name:'Onboard 2',sub:'Score leads',html:ob2},
  {cat:'onboard',num:'04',name:'Onboard 3',sub:'AI pitches',html:ob3},
  {cat:'onboard',num:'05',name:'Sign Up',sub:'Create account',html:signup},
  {cat:'onboard',num:'06',name:'Log In',sub:'Welcome back',html:login},
  {cat:'radar',num:'07',name:'Radar Map',sub:'Main map view',html:radarMap},
  {cat:'radar',num:'08',name:'Filters',sub:'Refine search',html:filterSheet},
  {cat:'radar',num:'09',name:'Scanning',sub:'Live progress',html:scanning},
  {cat:'radar',num:'10',name:'Pin Preview',sub:'Quick look',html:pinPreview},
  {cat:'leads',num:'11',name:'Lead Feed',sub:'All results',html:leadFeed},
  {cat:'leads',num:'12',name:'Lead Detail',sub:'Full profile',html:leadDetail},
  {cat:'leads',num:'13',name:'Gap Report',sub:'Digital audit',html:gapReport},
  {cat:'leads',num:'14',name:'Saved Lists',sub:'Collections',html:savedLists},
  {cat:'leads',num:'15',name:'Search',sub:'Find leads',html:searchScreen},
  {cat:'pitch',num:'16',name:'Pitch Home',sub:'Studio hub',html:pitchHome},
  {cat:'pitch',num:'17',name:'Generating',sub:'AI writing',html:pitchGen},
  {cat:'pitch',num:'18',name:'Pitch Ready',sub:'Email done',html:pitchReady},
  {cat:'pitch',num:'19',name:'Edit Pitch',sub:'Customise',html:pitchEdit},
  {cat:'pitch',num:'20',name:'AI Chat',sub:'Ask anything',html:aiChat},
  {cat:'profile',num:'21',name:'Dashboard',sub:'Your stats',html:dashboard},
  {cat:'profile',num:'22',name:'Settings',sub:'Preferences',html:settings},
  {cat:'profile',num:'23',name:'Alerts',sub:'Notifications',html:alerts},
  {cat:'profile',num:'24',name:'Go Pro',sub:'Upgrade plan',html:goPro},
  {cat:'profile',num:'25',name:'History',sub:'Past pitches',html:history},
];

function show(cat,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');
  const list=cat==='all'?screens:screens.filter(s=>s.cat===cat);
  const g=document.getElementById('grid');
  g.innerHTML='';
  list.forEach(s=>{
    const w=document.createElement('div');
    w.className='screen-wrap';
    w.innerHTML=`<div class="phone-frame"><div class="phone-inner">${s.html()}</div></div><div class="screen-label">${s.num} · ${s.name}</div><div class="screen-sub">${s.sub}</div>`;
    g.appendChild(w);
  });
}

/* ── shared micro-components ── */
function sb(light=false){
  const c=light?'#1a1a1a':'#fff';
  return `<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px 4px;font-size:10px;font-weight:600;color:${c}"><span>9:41</span><div style="display:flex;gap:5px;align-items:center"><span style="font-size:9px">●●●</span><span>WiFi</span><span>⬛</span></div></div>`;
}
function nb(active){
  const ic=['⊙','≡','✦','◎'];const lb=['Radar','Leads','Pitch','Me'];
  return `<div style="position:absolute;bottom:0;left:0;right:0;height:58px;background:#fff;border-top:1px solid #f0f0f0;display:flex;align-items:center;justify-content:space-around;padding:0 4px 4px">
    ${ic.map((i,n)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:10px;${n===active?'background:#f5f5f7':''}">
      <span style="font-size:17px;${n===active?'color:#1a1a1a':'color:#c0c0c0'}">${i}</span>
      <span style="font-size:8px;font-weight:${n===active?'600':'400'};color:${n===active?'#1a1a1a':'#c0c0c0'}">${lb[n]}</span>
    </div>`).join('')}
  </div>`;
}
function pill(text,type='gray'){
  const map={gray:'background:#f2f2f2;color:#555',red:'background:#fff1f2;color:#e11d48',amber:'background:#fffbeb;color:#d97706',green:'background:#f0fdf4;color:#16a34a',blue:'background:#eff6ff;color:#2563eb'};
  return `<span style="display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:500;${map[type]||map.gray}">${text}</span>`;
}
function card(content,style=''){
  return `<div style="background:#fff;border-radius:16px;border:1px solid #f0f0f0;padding:14px;${style}">${content}</div>`;
}
function avatar(text,color='#e8f5e9',tc='#2e7d32'){
  return `<div style="width:38px;height:38px;border-radius:12px;background:${color};display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:${tc};flex-shrink:0">${text}</div>`;
}
function scoreRing(n,color='#16a34a'){
  const pct=n;const r=18;const circ=2*Math.PI*r;const dash=circ*(pct/100);
  return `<div style="position:relative;width:44px;height:44px;flex-shrink:0">
    <svg width="44" height="44" style="transform:rotate(-90deg)"><circle cx="22" cy="22" r="${r}" fill="none" stroke="#f0f0f0" stroke-width="3"/><circle cx="22" cy="22" r="${r}" fill="none" stroke="${color}" stroke-width="3" stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}" stroke-linecap="round"/></svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><span style="font-size:11px;font-weight:700;color:#1a1a1a;line-height:1">${n}</span><span style="font-size:7px;color:#999;line-height:1">SCR</span></div>
  </div>`;
}
function inputField(label,placeholder,val=''){
  return `<div style="margin-bottom:12px"><div style="font-size:11px;font-weight:600;color:#1a1a1a;margin-bottom:5px">${label}</div><div style="height:42px;background:#f7f7f8;border-radius:12px;border:1.5px solid ${val?'#1a1a1a':'#ebebeb'};display:flex;align-items:center;padding:0 14px;font-size:12px;color:${val?'#1a1a1a':'#bbb'}">${val||placeholder}</div></div>`;
}
function bigBtn(text,bg='#1a1a1a',tc='#fff'){
  return `<div style="height:48px;background:${bg};border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:${tc};margin-bottom:10px">${text}</div>`;
}
function ghostBtn(text){
  return `<div style="height:44px;border-radius:14px;border:1.5px solid #e8e8e8;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:#555;margin-bottom:8px">${text}</div>`;
}

function radarMap(){return `<div style="width:100%;height:100%;position:relative;background:#e8ead0;overflow:hidden">
